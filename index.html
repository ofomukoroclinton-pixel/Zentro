<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#10131f">
<title>Zentro - Connect Real People</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
:root {
  --bg: #10131f;
  --panel: #191e2d;
  --panel2: #22293a;
  --text: #f5f7ff;
  --muted: #9ba5bd;
  --accent: #6c63ff;
  --accent2: #8b83ff;
  --border: #30384d;
  --danger: #ff5364;
  --success: #35d49a;
}

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font-family: Arial, Helvetica, sans-serif;
  min-height: 100vh;
}

button, input, textarea, select {
  font: inherit;
}

button {
  cursor: pointer;
}

button:disabled {
  opacity: .55;
  cursor: not-allowed;
}

input, textarea, select {
  width: 100%;
  padding: 13px;
  margin: 6px 0 13px;
  border: 1px solid var(--border);
  border-radius: 10px;
  background: var(--bg);
  color: var(--text);
  outline: none;
}

input:focus, textarea:focus, select:focus {
  border-color: var(--accent);
}

textarea {
  resize: vertical;
  min-height: 85px;
}

label {
  display: block;
  color: var(--muted);
  font-size: 13px;
  margin-top: 8px;
}

a {
  color: var(--accent2);
}

.hidden {
  display: none !important;
}

.primary {
  background: var(--accent);
  color: white;
  border: 0;
  border-radius: 10px;
  padding: 13px 17px;
  font-weight: bold;
  width: 100%;
}

.primary:hover {
  background: var(--accent2);
}

.secondary {
  background: var(--panel2);
  color: var(--text);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 10px 14px;
}

.danger {
  background: var(--danger);
  color: white;
  border: 0;
  border-radius: 9px;
  padding: 10px 14px;
}
  .brand {
  font-size: 34px;
  font-weight: 800;
  letter-spacing: -1px;
  color: white;
}

.brand span {
  color: var(--accent2);
}

.muted {
  color: var(--muted);
}

.small {
  font-size: 12px;
}

.card {
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: 15px;
  padding: 17px;
  margin-bottom: 15px;
}

.page-title {
  font-size: 25px;
  margin: 0 0 7px;
}

.auth-screen {
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 20px;
  background:
    radial-gradient(circle at top right, #302b69 0, transparent 42%),
    var(--bg);
}

.auth-box {
  width: 100%;
  max-width: 440px;
  background: rgba(25, 30, 45, .97);
  border: 1px solid var(--border);
  padding: 25px;
  border-radius: 20px;
  box-shadow: 0 20px 60px #0005;
}

.auth-heading {
  text-align: center;
  margin-bottom: 24px;
}

.auth-heading p {
  color: var(--muted);
  line-height: 1.5;
}

.auth-tabs {
  display: flex;
  gap: 8px;
  margin-bottom: 20px;
}

.auth-tabs button {
  flex: 1;
  padding: 12px;
  border: 1px solid var(--border);
  border-radius: 9px;
  background: var(--bg);
  color: var(--muted);
}

.auth-tabs button.active {
  background: var(--accent);
  color: white;
  border-color: var(--accent);
}

.message {
  padding: 12px;
  border-radius: 9px;
  margin: 12px 0;
  font-size: 14px;
  line-height: 1.5;
  overflow-wrap: anywhere;
}

.message:empty {
  display: none;
}

.message.error {
  background: #512632;
  color: #ffdce1;
}

.message.success {
  background: #163d35;
  color: #a5ffdf;
  }
  .message.info {
  background: #252e50;
  color: #d9ddff;
}

.loader {
  width: 24px;
  height: 24px;
  border: 3px solid #555;
  border-top-color: var(--accent2);
  border-radius: 50%;
  animation: spin .8s linear infinite;
  margin: 12px auto;
}

@keyframes spin {
  to { transform: rotate(360deg); }
}

#appScreen {
  min-height: 100vh;
}

.topbar {
  height: 65px;
  background: var(--panel);
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 20px;
  position: sticky;
  top: 0;
  z-index: 10;
}

.topbar .brand {
  font-size: 27px;
}

.app-layout {
  display: grid;
  grid-template-columns: 225px minmax(0, 1fr);
  max-width: 1250px;
  margin: auto;
  gap: 20px;
  padding: 20px;
}

.sidebar {
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: 15px;
  padding: 12px;
  height: max-content;
  position: sticky;
  top: 85px;
}

.sidebar-user {
  padding: 12px 8px 18px;
  border-bottom: 1px solid var(--border);
  margin-bottom: 10px;
  overflow-wrap: anywhere;
}

.nav-btn {
  width: 100%;
  text-align: left;
  border: 0;
  background: transparent;
  color: var(--muted);
  padding: 13px 12px;
  border-radius: 10px;
  margin: 2px 0;
}

.nav-btn:hover,
.nav-btn.active {
  background: var(--panel2);
  color: white;
}

.main-content {
  min-width: 0;
}

.page {
  display: none;
  }
  .page.active {
  display: block;
}

.avatar {
  width: 44px;
  height: 44px;
  border-radius: 50%;
  background: var(--accent);
  display: inline-flex;
  align-items: center;
  justify-content: center;
  object-fit: cover;
  color: white;
  font-weight: bold;
  flex-shrink: 0;
}

.avatar.large {
  width: 90px;
  height: 90px;
  font-size: 25px;
}

.row {
  display: flex;
  align-items: center;
  gap: 12px;
}

.between {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 10px;
}

.post-content {
  white-space: pre-wrap;
  overflow-wrap: anywhere;
  line-height: 1.6;
}

.post-image {
  width: 100%;
  max-height: 450px;
  object-fit: contain;
  border-radius: 10px;
  margin-top: 10px;
  background: var(--bg);
}

.post-actions {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  border-top: 1px solid var(--border);
  padding-top: 12px;
  margin-top: 12px;
}

.post-actions button {
  flex: 1;
  min-width: 75px;
}

.list-item {
  padding: 13px 0;
  border-bottom: 1px solid var(--border);
}

.list-item:last-child {
  border-bottom: 0;
}

.empty-state {
  text-align: center;
  padding: 30px 15px;
  color: var(--muted);
}

#bottomNav {
  display: none;
}

@media (max-width: 760px) {
  .app-layout {
    display: block;
    padding: 12px;
  }

  .sidebar {
    display: none;
  }

  .topbar {
    padding: 0 13px;
  }

  #bottomNav {
    display: flex;
    position: fixed;
    bottom: 0;
    left: 0;
    right: 0;
    z-index: 20;
    background: var(--panel);
    border-top: 1px solid var(--border);
    overflow-x: auto;
    padding: 5px;
